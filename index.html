<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的个人网站</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 18px;
      background: #0b0e17; color: #f1f5f9; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-image: radial-gradient(circle at 15% 10%, rgba(56,189,248,.08), transparent 35%),
                        radial-gradient(circle at 85% 80%, rgba(168,85,247,.07), transparent 35%);
    }
    h1 { font-size: 2rem; margin: 0; letter-spacing: .5px; }
    p { color: #94a3b8; margin: 0; }
    a.card {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 12px;
      padding: 14px 22px; border-radius: 12px; text-decoration: none;
      background: #1a2133; border: 1px solid rgba(56,189,248,.45); color: #38bdf8;
      font-weight: 600; transition: .2s;
    }
    a.card:hover { background: rgba(56,189,248,.16); transform: translateY(-1px); }
  </style>
</head>
<body>
  <h1>你好，我是 deqing</h1>
  <p>欢迎来到我的个人网站。</p>
  <a class="card" href="/ai-game/">进入 3D 工作流笔记 → Blender / AI-3D</a>
</body>
</html>
